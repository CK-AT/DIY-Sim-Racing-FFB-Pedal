syntax = "proto3";

enum AxisID {
  AXIS_UNDEFINED = 0;
  AXIS_ID_1 = 1;
  AXIS_ID_2 = 2;
  AXIS_ID_3 = 3;
  AXIS_ID_4 = 4;
  AXIS_ID_5 = 5;
  AXIS_ID_6 = 6;
  AXIS_ID_7 = 7;
  AXIS_ID_8 = 8;
  AXIS_ID_MASK = 15;      // masks out the significant bits to identify the axis
  AXIS_INDEPENDENT = 64;  // used for FunctionBase.linked_axes, marks this axis as independent (no force/position coupling)
  AXIS_SUBTRACTIVE = 128; // used for FunctionBase.linked_axes, treated as ADDITIVE if this bit is not set 
}

enum GatewayID {
  GATEWAY_UNDEFINED = 0;
  GATEWAY_ID_1 = 1;
  GATEWAY_ID_2 = 2;
}

enum HomingDirection {
  HOMING_DIR_UNSPECIFIED = 0;
  HOMING_DIR_NEGATIVE = 1;
  HOMING_DIR_POSITIVE = 2;
}

enum LogLevel {
  LOG_LEVEL_UNDEFINED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARNING = 3;
  LOG_LEVEL_ERROR = 4;
}

message AxisLogMessage {
  // axis ID, source of this log message 
  AxisID axis_id = 1;
  // log level
  LogLevel level = 2;
  // log message
  string msg = 3;
}

message GatewayLogMessage {
  // gateway ID, source of this log message 
  GatewayID gateway_id = 1;
  // log level
  LogLevel level = 2;
  // log message
  string msg = 3;
}

message KFConstVelConfig {
  // noise scaling (divided by 255 to get a factor between 0 and 1)
  uint32 noise_scaling = 1;
}

message KFConstAccelConfig {
  // noise scaling (divided by 255 to get a factor between 0 and 1)
  uint32 noise_scaling = 1;
}

message DIYPedalKinematicConfig {
  // distance between pedal pivot and foot contact point in mm
  uint32 l_pivot_foot = 1; 
  // distance between pedal pivot and the point where the link is mounted in mm
  uint32 l_pivot_link = 2; 
  // length of the link between pedal and sled in mm
  uint32 l_link = 3; 
  // distance between pedal pivot and sled in vertical direction in mm
  uint32 l_pivot_sled_y = 4; 
  // distance between pedal pivot and sled minimum position in horizontal direction in mm
  uint32 l_pivot_sled_x_min = 5; 
  // sled stroke min to max in mm
  uint32 l_sled_stroke = 6; 
}

message GeneralKinematicPin {
  // unique pin ID (referenced by bars)
  uint32 pin_id = 1;
  // pin position in mm (x-right, y-up; negative allowed)
  float x = 2;
  float y = 3;
  // fixed to world coordinates (pivot)
  bool grounded = 4;
  // contact point for position/force output (exactly one)
  bool is_contact_point = 5;
  // rail interface pin (exactly one; moves along -rail_travel_negative..+rail_travel_positive on X axis)
  bool is_rail_interface = 6;
}

message GeneralKinematicBar {
  // at least two pins that form a rigid bar
  repeated uint32 pin_ids = 1;
  // 2-pin bar that acts as metering element (exactly one)
  bool is_metering = 2;
}

message GeneralKinematicConfig {
  // all pins in world coordinates
  repeated GeneralKinematicPin pins = 1;
  // all bars, each linking two or more pins
  repeated GeneralKinematicBar bars = 2;
  // rail travel from zero position in negative direction (mm)
  float rail_travel_negative = 3;
  // rail travel from zero position in positive direction (mm)
  float rail_travel_positive = 4;
}

message KinematicParameters {
  // minimum absolute contact point position (0.1mm/LSB)
  int32 contact_point_pos_min_abs = 1;
  // maximum absolute contact point position (0.1mm/LSB)
  int32 contact_point_pos_max_abs = 2;
  // polynomial coefficients for the conversion factor from load cell force to contact point force over contact point position
  repeated double coeffs_force_factor_over_contact_point_pos = 3;
  // five polynomial coefficients for the conversion from contact point position to sled position
  repeated double coeffs_sled_pos_over_contact_point_pos = 4;
}

message AxisConfig {
  message OscillationGuard {
    // damping gain applied when oscillation detected
    float k_max = 1;
    // minimum oscillation amplitude in contact point units (mm)
    float min_amplitude = 2;
    // minimum velocity magnitude in contact point units per second
    float min_velocity = 3;
    // minimum oscillation frequency (full period)
    float min_frequency_hz = 4;
    // maximum oscillation frequency (full period)
    float max_frequency_hz = 5;
    // hold time in ms after detection
    uint32 hold_time_ms = 6;
    // ramp time in ms for damping gain
    uint32 ramp_time_ms = 7;
    // oscillation hits required before damping engages
    uint32 required_hits = 8;
  }

  message StaticBalanceConfig {
    // unix timestamp when the curve was captured (seconds)
    uint32 created_at_epoch_s = 1;
    // calibration revision
    uint32 revision = 2;
    // polynomial center in mm (x normalized around this center)
    float x_center = 3;
    // half range in mm (normalizes x to [-1..1])
    float x_half_range = 4;
    // polynomial coefficients (lowest order first)
    repeated float coeffs = 5;
  }

  // axis ID, will be used by gateways to dispatch to the correct axis and as the ID definition for HW w/o ID DIP switches
  AxisID axis_id = 1;
  // all kinematic parameters required to convert positions and forces including physical position limits
  KinematicParameters kinematic_parameters = 2;
  // position resolution in steps/mm
  uint32 steps_per_mm = 3;
  // loadcell rating in N
  uint32 f_max_loadcell = 4;
  // invert loadcell sign
  bool b_loadcell_inverted = 5;
  // invert motor direction
  bool b_motor_inverted = 6;
  // spindle pitch in mm/rev
  uint32 mm_per_rev = 7;
  // enable ESPnow
  bool b_esp_now_enabled = 8;
  // store to EEPROM
  bool store = 9;
  // load cell filter config
  oneof load_cell_filter_config {
    KFConstVelConfig kf_const_vel = 10;
    KFConstAccelConfig kf_const_accel = 11;
    bool filter_none = 13;
  }
  // used by the Simhub Plugin to store all required kinematic model parameters
  oneof kinematic_config {
    DIYPedalKinematicConfig diy_pedal = 12;
    GeneralKinematicConfig general_kinematic = 16;
  }
  // physics oversampling factor
  uint32 physics_iterations_per_sample = 14;
  // homing direction for the servo: negative = default
  HomingDirection homing_direction = 15;
  // oscillation guard configuration
  OscillationGuard oscillation_guard = 17;
  // static balance curve and metadata
  StaticBalanceConfig static_balance_config = 18;
  // axis-level safety damping floor in (N*s)/mm. Applied unconditionally by Sim
  // at the integrator regardless of which function is active or what frames are
  // flowing. 0 = no floor (default).
  float min_damping = 19;
}

enum ControllerAxis {
  CONTROLLER_AXIS_UNDEFINED = 0;
  CONTROLLER_AXIS_X = 1;
  CONTROLLER_AXIS_Y = 2;
  CONTROLLER_AXIS_Z = 3;
  CONTROLLER_AXIS_R_X = 4;
  CONTROLLER_AXIS_R_Y = 5;
  CONTROLLER_AXIS_R_Z = 6;
  CONTROLLER_AXIS_RUD = 7;
  CONTROLLER_AXIS_THR = 8;
  CONTROLLER_AXIS_ACC = 9;
  CONTROLLER_AXIS_BRK = 10;
  CONTROLLER_AXIS_STEER = 11;
}

enum FunctionID {
  FUNCTION_ID_UNDEFINED = 0;
  FUNCTION_ID_BRAKE_PEDAL = 1;
  FUNCTION_ID_ACCELERATOR_PEDAL = 2;
  FUNCTION_ID_CLUTCH_PEDAL = 3;
  FUNCTION_ID_FLIGHT_PEDALS = 4;
  FUNCTION_ID_FLIGHT_STICK_PITCH = 5;
  FUNCTION_ID_FLIGHT_STICK_ROLL = 6;
  FUNCTION_ID_SHIFTER = 7;
  FUNCTION_ID_FLIGHT_STICK_COLLECTIVE = 8;
}

enum OutputMode {
  OUTPUT_MODE_UNDEFINED = 0;
  OUTPUT_MODE_FORCE = 1;
  OUTPUT_MODE_TRAVEL = 2;
}

message FunctionBase {
  // assigned function (used by Simhub plugin for internal mapping)
  FunctionID function_id = 1;
  // a list four axis IDs where the first value defines the primary axis, can be OR'ed with AXIS_SUBTRACTIVE (e.g. for a left flight pedal)
  repeated AxisID linked_axes = 2;
  // controller axis to output to
  ControllerAxis controller_output_axis = 3;
  // use force or travel as joystick output
  OutputMode output_mode = 4;
  // minimum force / position (0% up to this threshold)
  float output_min = 5;
  // maximum force / position (100% above this threshold)
  float output_max = 6;
  // store to EEPROM
  bool store = 7;
}

enum ABSPattern {
  ABS_PATTERN_UNDEFINED = 0;
  ABS_PATTERN_SINE = 1;
  ABS_PATTERN_SAWTOOTH = 2;
}

enum ABSMode {
  ABS_MODE_OFF = 0;
  ABS_MODE_FORCE = 1;
  ABS_MODE_TRAVEL = 2;
}

enum ForceDirection {
  FORCE_DIRECTION_UNDEFINED = 0;
  FORCE_DIRECTION_ADD = 1;
  FORCE_DIRECTION_SUBTRACT = 2;
}

message SplineForceCurveConfig {
  // minimum position in mm
  int32 pos_min = 1;
  // maximum position in mm
  int32 pos_max = 2;
  // minimum force in N
  float f_min = 3;
  // maximum force in N
  float f_max = 4;
  // relative force in percent in 20% relative position increments (six points)
  repeated uint32 f_rel_points = 5;
  // cubic spline "a" parameters (5 points)
  repeated float cubic_spline_params_a = 6;
  // cubic spline "b" parameters (5 points)
  repeated float cubic_spline_params_b = 7;
  // force direction (DIRECTION_SUBTRACT for an automotive pedal)
  ForceDirection force_direction = 8;
}

message DamperConfig {
  // damping in positive/pressing direction in (N*s)/mm
  float positive_factor = 1;
  // damping in negative/pulling direction in (N*s)/mm
  float negative_factor = 2;
}

message ABSEffectConfig {
  // effect enabled
  bool enabled = 1;
  // mode
  ABSMode mode = 2;
  // frequency in Hz
  uint32 freq = 3;
  // amplitude in N
  uint32 ampl = 4;
  // effect pattern
  ABSPattern pattern = 5;
  // Simulated ABS trigger level (in percent, active if > 0)
  uint32 sim_level = 6;
}

enum RPMEffectType {
  RPM_EFFECT_UNDEFINED = 0;
  RPM_EFFECT_RPM = 1;
  RPM_EFFECT_SPEED_RUMBLE = 2;
}

message RPMEffectConfig {
  // effect enabled
  bool enabled = 1;
  // maximum frquency in Hz
  uint32 max_freq = 2;
  // minimum frquency in Hz
  uint32 min_freq = 3;
  // amplitude in N
  uint32 amp = 4;
  // effect type
  RPMEffectType type = 5;
}

message BitePointEffectConfig {
  // effect enabled
  bool enabled = 1;
  // bite point effect trigger threshold in percent of travel
  uint32 trigger_value = 2;
  // bite point effect amplitude in N
  uint32 amp = 3;
  // bite point effect frequency in Hz
  uint32 freq = 4;
}

message GForceEffectConfig {
  // effect enabled
  bool enabled = 1;
  // multiplier in percent
  uint32 multi = 2;
  // filter window width in number of samples
  uint32 window = 3;
}

message WheelSlipEffectConfig {
  // effect enabled
  bool enabled = 1;
  // amplitude in N
  uint32 amp = 2;
  // frequency in Hz
  uint32 freq = 3;
}

message RoadImpactEffectConfig {
  // effect enabled
  bool enabled = 1;
  // multiplier in percent
  uint32 multi = 2;
  // filter window width in number of samples
  uint32 window = 3;
}

message CustomVibrationEffectConfig {
  // effect enabled
  bool enabled = 1;
  // amplitude in N
  uint32 amp = 2;
  // frequency in Hz
  uint32 freq = 3;
}

message AutomotivePedalConfig {
  // pedal idle (close) position in mm
  int32 pos_idle = 1;
  // pedal end (distant) position in mm
  int32 pos_end = 2;
  // force curve configuration
  SplineForceCurveConfig force_curve_config = 3;
  // damper configuration
  DamperConfig damper_config = 4;
  // ABS effect configuration
  ABSEffectConfig abs_effect_config = 5;
  // RPM effect configuration
  RPMEffectConfig rpm_effect_config = 6;
  // bite point effect configuration
  BitePointEffectConfig bite_point_effect_config = 7;
  // G force effect configuration
  GForceEffectConfig g_force_effect_config = 8;
  // wheel slip effect configuration
  WheelSlipEffectConfig wheel_slip_effect_config = 9;
  // Road impact effect configuration
  RoadImpactEffectConfig road_impact_effect_config = 10;
  // Custom Vibration 1 effect configuration
  CustomVibrationEffectConfig cv_1_effect_config = 11;
  // Custom Vibration 2 effect configuration
  CustomVibrationEffectConfig cv_2_effect_config = 12;
}

message RudderBrakeConfig {
  // controller axis of the associated flight pedals, this is required to calculate left/right brake balance
  ControllerAxis controller_output_axis_flight_pedals = 1;
  // controller axis to output the left pedal brake value to
  ControllerAxis controller_output_axis_left_pedal = 2;
  // controller axis to output the right pedal brake value to
  ControllerAxis controller_output_axis_right_pedal = 3;
  // minimum total force for braking (0% up to this threshold)
  float f_min = 4;
  // maximum total force for braking (100% above this threshold)
  float f_max = 5;
}

enum ShifterGear {
  // neutral slot (default)
  SHIFTER_GEAR_NEUTRAL = 0;
  SHIFTER_GEAR_1 = 1;
  SHIFTER_GEAR_2 = 2;
  SHIFTER_GEAR_3 = 3;
  SHIFTER_GEAR_4 = 4;
  SHIFTER_GEAR_5 = 5;
  SHIFTER_GEAR_6 = 6;
  SHIFTER_GEAR_7 = 7;
  SHIFTER_GEAR_REVERSE = 8;
  SHIFTER_GEAR_SEQUENTIAL_UP = 9;
  SHIFTER_GEAR_SEQUENTIAL_DOWN = 10;
}

message ShifterGearSlot {
  // slot center in 0.1mm units (x-right, y-up; negative allowed)
  sint32 center_x = 1;
  sint32 center_y = 2;
  // half size in 0.1mm units
  uint32 half_width = 3;
  uint32 half_height = 4;
  // gear selection for this slot (mapped to fixed button indices in firmware)
  ShifterGear gear = 5;
}

message ShifterDetectConfig {
  // up to 8 gear slots
  repeated ShifterGearSlot gear_slots = 1;
  // hysteresis added to slot bounds in 0.1mm units
  uint32 hysteresis = 2;
}

message AuxFunctionConfig {
  // a list of up to 4 axis IDs where the first value defines the primary axis, can be OR'ed with AXIS_SUBTRACTIVE (e.g. for a left flight pedal)
  repeated AxisID linked_axes = 1;
  // controller axis to output to
  oneof specific {
    RudderBrakeConfig rudder_brake = 2;
    ShifterDetectConfig shifter_detect = 3;
  }
}

// Unified config for all four flight functions: FlightStickPitch, FlightStickRoll,
// FlightStickCollective, FlightPedals. Differentiated by FunctionID alone.
// The damping field is the rest/safety value applied when no FlightFFB frames
// flow; per-frame FlightFfbAction.k_damper is authoritative while frames are
// flowing. AxisConfig.min_damping is the unconditional axis-level floor.
message FlightControlConfig {
  // minimum position in mm
  int32 pos_min = 1;
  // maximum position in mm
  int32 pos_max = 2;
  // rest/safety damping in (N*s)/mm (applied when no FlightFFB frames flow)
  float damping = 3;
  // centering spring constant in N/mm
  float centering_spring_const = 4;
  // phase offset in radians, applied uniformly to all DDS 1 harmonics.
  // Encodes both axis (pitch=0, roll=+/-pi/2) and rotor handedness.
  // DDS 2 always uses 0 (engine vibration is isotropic).
  float phase_offset = 5;
  // DDS 1 harmonic ratios (multipliers on fundamental_hz per slot, up to 5).
  // Slot count = array length. Slot semantics paired with FlightFfbAction.vib_amp_slotN.
  repeated float vib_harmonic_ratios = 6;
  // DDS 2 harmonic ratios (engine 2 / tail rotor / etc).
  repeated float vib2_harmonic_ratios = 7;
}

message ShifterGateSegment {
  // start/end in 0.1mm units
  sint32 x0 = 1;
  sint32 y0 = 2;
  sint32 x1 = 3;
  sint32 y1 = 4;
  // corridor half width in 0.1mm units
  uint32 half_width = 5;
  // centering spring in N/mm (inside corridor)
  float spring_center = 6;
  // wall spring in N/mm (outside corridor)
  float spring_wall = 7;
}

message ShifterDetentPoint {
  // detent center in 0.1mm units
  sint32 x = 1;
  sint32 y = 2;
  // influence radius in 0.1mm units
  uint32 radius = 3;
  // spring in N/mm
  float spring = 4;
}

message ShifterConfig {
  // axis travel limits in mm
  int32 pos_x_min = 1;
  int32 pos_x_max = 2;
  int32 pos_y_min = 3;
  int32 pos_y_max = 4;
  // damping in (N*s)/mm
  float damping = 5;
  // clamp force magnitude (0 = disabled)
  float max_force = 6;
  // grid step for the LUT in 0.1mm units
  uint32 grid_step = 7;
  // sequential mode (Y-only)
  bool sequential = 8;
  // gate geometry
  repeated ShifterGateSegment gate_segments = 9;
  // detent wells
  repeated ShifterDetentPoint detents = 10;
}

message FunctionConfig {
  FunctionBase base = 1;
  oneof specific {
    AutomotivePedalConfig automotive_pedal = 2;
    FlightControlConfig flight_control = 12;
    ShifterConfig shifter = 9;
  }
  // Reserved tags from previous proto revisions:
  //   3 = FlightPedalsConfig (subsumed by flight_control)
  //   7 = FlightStickConfig (subsumed by flight_control)
  //   8, 11 = unrelated historical reservations
  reserved 3, 7, 8, 11;
  AuxFunctionConfig aux_function = 4;
  // simulated mass in kg
  float simulated_mass = 5;
  // friction in N
  float friction = 6;
  // static balance tuning (per function)
  message StaticBalanceTuning {
    bool enabled = 1;
    float gain = 2;
  }
  StaticBalanceTuning static_balance_tuning = 10;
}

message AxisAction {
  // axis ID of the affected axis
  AxisID axis_id = 1;
  oneof action {
    bool restart = 2;
    bool enable_ota = 3;
    bool return_axis_config = 4;
    bool return_function_config = 5;
    uint32 debug_flags = 6;
    bool return_active_function = 7;
    bool start_static_balance_calibration = 8;
    bool start_homing = 9;
  }
}

message AxisState {
  // ID of the axis this message represents
  AxisID axis_id = 1;
  // relative position
  float position = 2;
  // relative force
  float force = 3;
}

message StaticBalanceResult {
  // axis ID of the affected axis
  AxisID axis_id = 1;
  // minimum contact point position in mm
  float x_min = 2;
  // maximum contact point position in mm
  float x_max = 3;
  // sample spacing in mm
  float sample_step = 4;
  // force offsets in N for each sample from x_min to x_max
  repeated float f_offset = 5;
}

message GatewayState {
  // ESPNow RSSI, 255 = CAN
  uint32 rssi = 1;
  // one bit per axis ID, bit 0 = axis 1 
  uint32 axes_present = 2;
  // gateway ID, source of this state message 
  GatewayID gateway_id = 3;
}

message AutomotivePedalFFBAction {
  bool trigger_abs = 1;
  uint32 rpm = 2;
  uint32 g = 3;
  bool trigger_ws = 4;
  uint32 impact_value = 5;
  bool trigger_cv_1 = 6;
  bool trigger_cv_2 = 7;
}

message FlightFfbAction {
  // centering spring gain (scaled by SimHub)
  float k_spring = 1;
  // damping gain (scaled by SimHub)
  float k_damper = 2;
  // friction gain (scaled by SimHub)
  float k_friction = 6;
  // trim offset in contact point units (mm)
  float trim_offset = 3;
  // buffet amplitude (0..1 or scaled by SimHub)
  float buffet_amp = 4;
  // constant load force in N
  float load_force = 5;
  // DDS 1 amplitudes per slot, encoded as uint8 at 0.05 N/LSB (range 0..12.75 N).
  // Slot semantics set by FlightControlConfig.vib_harmonic_ratios.
  uint32 vib_amp_slot1 = 7;
  uint32 vib_amp_slot2 = 8;
  uint32 vib_amp_slot3 = 9;
  uint32 vib_amp_slot4 = 10;
  uint32 vib_amp_slot5 = 11;
  // DDS 2 amplitudes per slot, encoded as uint8 at 0.05 N/LSB.
  // Slot semantics set by FlightControlConfig.vib2_harmonic_ratios.
  uint32 vib2_amp_slot1 = 12;
  uint32 vib2_amp_slot2 = 13;
}

message FFBAction {
  // targeted function, will be used by gateways to dispatch to the correct axis
  FunctionID function_id = 1;
  oneof function {
    AutomotivePedalFFBAction automotive_pedal = 2;
    FlightFfbAction flight_ffb = 3;
  }
}

message ActiveFunction {
  AxisID axis_id = 1;
  FunctionID function_id = 2;
}

message WifiInfo {
  string ssid = 1;
  string password = 2;
}

enum OtaTarget {
  OTA_TARGET_UNSPECIFIED = 0;
  OTA_TARGET_ALL = 1;
  OTA_TARGET_AXES_ONLY = 2;
  OTA_TARGET_GATEWAY_ONLY = 3;
}

message StartOtaUpdate {
  WifiInfo wifi_info = 1;
  string info_json_url = 2;
  bool allow_downgrades = 3;
  OtaTarget target = 4;
  // Optional: target a specific axis (use with OTA_TARGET_AXES_ONLY or OTA_TARGET_ALL)
  AxisID target_axis_id = 5;
}

message DeviceInfo {
  oneof source {
    AxisID axis_id = 1;
    GatewayID gateway_id = 2;
  }
  string fw_version = 3;
  string build_timestamp = 4;
  string git_hash = 5;
  string board = 6;
  string device_uid = 7;
}

message DeviceInfoRequest {
  oneof target {
    AxisID axis_id = 1;
    GatewayID gateway_id = 2;
  }
}

// DDS oscillator fundamentals broadcast by the SimHub plugin.
// Sent once per FFB tick. Gateway snoops these out of the message
// stream and feeds its master DDS for the 0x0F0 CAN sync frame.
message DdsFundamentals {
  float dds1_fundamental_hz = 1;
  float dds2_fundamental_hz = 2;
}

message Message {
  oneof payload {
    AxisLogMessage axis_log_message = 1;
    AxisConfig axis_config = 2;
    FunctionConfig function_config = 3;
    AxisAction axis_action = 4;
    AxisState axis_state = 5;
    GatewayState gateway_state = 6;
    FFBAction ffb_action = 7;
    GatewayLogMessage gateway_log_message = 8;
    ActiveFunction active_function = 9;
    StartOtaUpdate start_ota_update = 10;
    DeviceInfo device_info = 11;
    DeviceInfoRequest device_info_request = 12;
    StaticBalanceResult static_balance_result = 13;
    DdsFundamentals dds_fundamentals = 14;
  }
}

// to be used by SimHub plugin only (to store i.e. a list of Message items as a system config)
message ConfigItem {
  oneof item {
    AxisConfig axis_config = 1;
    FunctionConfig function_config = 2;
  }
}

message ConfigItemsList {
  repeated ConfigItem config_items = 1;
}
