; GripController — standalone USB HID joystick for a stick grip
; (push buttons + AS5600 rotary axis) on a Waveshare ESP32-S3-Zero board.
;
; Native USB device: enumerates directly to the PC as its own joystick.
; No link to the FFB / CAN-gateway firmware (see ESP32/ for that).

[platformio]
default_envs = grip-s3-mini

[env]
framework = arduino
platform = espressif32
platform_packages =
	platformio/framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.17
	platformio/framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-libs.git#idf-release/v5.1
monitor_speed = 115200

[env:grip-s3-mini]
; Waveshare ESP32-S3-Zero (ESP32-S3FH4R2). The lolin_s3_mini profile is the
; electrical match: same 4MB flash + 2MB PSRAM, native USB-C. Adjust if needed.
board = lolin_s3_mini
board_build.f_cpu = 240000000L
; Project-local variant (a copy of lolin_s3_mini with USB_VID/PID #ifndef-
; guarded) so the build-flag VID/PID below take effect — see variants/.
board_build.variants_dir = variants
board_build.variant = grip_s3_mini
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-Werror=return-type
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	-DCORE_DEBUG_LEVEL=0
	; Native USB (TinyUSB). HID + CDC composite: CDC-on-boot gives a serial port
	; whose 1200bps-touch (board_upload.use_1200bps_touch below) auto-enters the
	; ROM bootloader on upload — flashing needs no BOOT button.
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MSC_ON_BOOT=0
	-DARDUINO_USB_DFU_ON_BOOT=0
	; USB identity must be COMPILE-TIME here: CDC-on-boot makes the core call
	; USB.begin() before setup() runs, so a runtime USB.productName()/VID()/PID()
	; would be too late. The grip_s3_mini variant #ifndef-guards USB_VID/PID, so
	; these win. Scheme mirrors the FFB firmware (VID 0x303b): gateways 0x8210+N,
	; axes 0x8220+N — the grip takes its own 0x8230 block.
	-DUSB_VID=0x303b
	-DUSB_PID=0x8230
	'-DUSB_PRODUCT="DIY-FFB-Grip-MD500-Collective"'
	'-DUSB_MANUFACTURER="OpenSource"'
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
lib_deps =
	Joystick_ESP32S2=https://github.com/schnoog/Joystick_ESP32S2/archive/refs/heads/dev.zip
