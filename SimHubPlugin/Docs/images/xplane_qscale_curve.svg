<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <rect width="900" height="260" fill="#0f1115"/>
  <rect x="60" y="30" width="780" height="200" rx="8" fill="#1c2028" stroke="#2b2f38" stroke-width="1"/>
  <line x1="90" y1="200" x2="810" y2="200" stroke="#5c6370" stroke-width="1"/>
  <line x1="90" y1="50" x2="90" y2="200" stroke="#5c6370" stroke-width="1"/>

  <line x1="90" y1="200" x2="810" y2="200" stroke="#3a3f4b" stroke-dasharray="4,4"/>
